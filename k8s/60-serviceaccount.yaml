# ServiceAccount'ы для подов namespace gophprofile.
#
# Отдельные SA для приложения и для инфраструктуры: так права можно расширять
# независимо (например, если инфраструктуре понадобится доступ к API, приложение
# его не получит).
#
# automountServiceAccountToken: false — ключевое поле. По умолчанию kubelet
# монтирует в каждый под токен ServiceAccount, которым можно аутентифицироваться
# в API-сервере. Приложению Kubernetes API не нужен вообще (оно работает с
# PostgreSQL, S3 и RabbitMQ по сетевым протоколам), поэтому токен в подах не
# нужен и его монтирование отключено: утёкший токен из скомпрометированного
# пода не даст доступа к API.
#
# RBAC (Role/RoleBinding) намеренно НЕ добавляется: без токена под не может
# обращаться к API, а «пустая» роль лишь создавала бы видимость прав. Нужны
# только сами SA — они служат якорями для NetworkPolicy-независимой
# идентификации подов и для отключения автомонтирования токена.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gophprofile-sa
  namespace: gophprofile
  labels:
    app.kubernetes.io/part-of: gophprofile
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gophprofile-db-sa
  namespace: gophprofile
  labels:
    app.kubernetes.io/part-of: gophprofile
automountServiceAccountToken: false
