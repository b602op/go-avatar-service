# HPA для HTTP-сервера: единственный компонент, который масштабируется по нагрузке.
#
# Почему только server: он принимает пользовательский трафик, и его нагрузка
# растёт вместе с числом запросов. Воркер масштабируется иначе — он разбирает
# очередь, и его ёмкость определяется числом сообщений, а не CPU (отдельная
# задача, в этом шаге не делается). Postgres/minio/rabbitmq — StatefulSet'ы с
# одним томом, реплики без переработки приложения не дадут ничего.
#
# Масштабирование работает только потому, что у контейнера server заданы
# resources.requests (100m CPU, 128Mi): утилизация считается как
# usage / request, и без requests HPA не смог бы вычислить процент
# (TARGETS показывал бы <unknown>).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: server-hpa
  namespace: gophprofile
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: server
  # minReplicas совпадает с replicas в Deployment (2): это же число остаётся
  # полом, ниже которого HPA не опускается после спада нагрузки. Само поле
  # replicas в Deployment не трогаем — после включения HPA оно становится
  # лишь начальным значением, а дальше репликами управляет контроллер.
  minReplicas: 2
  # 10 — потолок для учебного кластера: 10 подов × 500m CPU = 5 ядер, что
  # уже сопоставимо с ресурсами ноды minikube.
  maxReplicas: 10
  metrics:
    # CPU — основной сигнал: запросы к API упираются в процессор (JSON,
    # валидация, обращение к БД и S3), поэтому рост нагрузки виден по CPU
    # раньше, чем по памяти.
    #
    # Порог 70% от requests (100m) = 70m на под. Учитывая, что в покое сервер
    # потребляет ~1m, порог означает реальную нагрузку, а не фоновый шум.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Память как второй сигнал. Go-рантайм держит память долго и отдаёт её ОС
    # неохотно, поэтому 80% (≈102Mi из 128Mi) — высокий порог: он срабатывает
    # на реальной утечке или на всплеске одновременных загрузок, а не на
    # обычном поведении сборщика мусора.
    #
    # HPA складывает рекомендации по всем метрикам и берёт максимум: одного
    # превышения достаточно, чтобы добавить поды.
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
