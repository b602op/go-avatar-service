# Секреты стека: учётные данные PostgreSQL, MinIO (S3) и RabbitMQ.
#
# stringData, а не data: Kubernetes сам закодирует значения в base64, поэтому
# в манифесте они читаются как есть. Это учебный проект, поэтому пароли —
# дефолтные из docker-compose.yml; в реальном кластере их подставлял бы
# внешний секрет-менеджер, а не файл в git.
#
# Один Secret на всех потребителей: и инфраструктура (postgres, minio,
# rabbitmq), и приложение (server, worker) берут значения через envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: gophprofile-secrets
  namespace: gophprofile
type: Opaque
stringData:
  # ─── PostgreSQL ───
  POSTGRES_USER: avatar
  POSTGRES_PASSWORD: avatar
  POSTGRES_DB: avatars

  # ─── MinIO (S3): root-доступ для самого хранилища ───
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

  # ─── MinIO (S3): ключи, которыми ходит приложение ───
  # Дублируют root-доступ: отдельного сервисного пользователя MinIO в проекте
  # нет, поэтому сервер и воркер авторизуются теми же ключами.
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin

  # ─── RabbitMQ: брокер создаёт этого пользователя при первом старте ───
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASS: guest
  # URL целиком — здесь, а не в ConfigMap: в нём пароль. Значения со
  # спецсимволами (`@`, `:`, `/`) требуют percent-encoding.
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
