# Воркер обработки событий: Deployment на 1 реплику.
#
# Deployment, а не StatefulSet: состояние воркера — это очередь в RabbitMQ и
# записи в PostgreSQL, а не локальный диск. Реплика одна, потому что
# масштабирование потребителей ограничено конкурентностью: каждый под
# забирает сообщения из общей очереди, и несколько реплик просто поделили бы
# поток (осмысленно, но на этом шаге не требуется).
#
# Service нужен только ради метрик и /health: публичного HTTP-API у воркера нет.
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: gophprofile
  labels:
    app: worker
spec:
  selector:
    app: worker
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: gophprofile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # См. комментарий в 20-server.yaml: SA без автомонтирования токена,
      # явные uid/gid вместо унаследованных из образа.
      serviceAccountName: gophprofile-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # См. комментарий в 20-server.yaml: ждём готовности postgres, minio и
      # rabbitmq, иначе воркер падает на старте (он тоже проверяет бакет и
      # подключается к брокеру) и уходит в CrashLoopBackOff.
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              for target in postgres:5432 minio:9000 rabbitmq:5672; do
                host=${target%:*}
                port=${target#*:}
                until nc -w 2 "$host" "$port" </dev/null; do
                  echo "waiting for $host:$port"
                  sleep 2
                done
                echo "$host:$port is ready"
              done
      containers:
        - name: worker
          image: gophprofile-worker:latest
          # Образ собран локально (Dockerfile, target worker) и загружен в
          # кластер — см. комментарий в 20-server.yaml.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9091
          envFrom:
            - configMapRef:
                name: gophprofile-config
            - secretRef:
                name: gophprofile-secrets
          env:
            # У воркера нет публичного HTTP-сервера: метрики и /health живут на
            # :9091, чтобы не конфликтовать с дефолтным :9090.
            - name: METRICS_ADDR
              value: ":9091"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: gophprofile-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gophprofile-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: gophprofile-secrets
                  key: POSTGRES_DB
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gophprofile-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gophprofile-secrets
                  key: S3_SECRET_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # См. комментарий в 20-server.yaml: воркер тоже ничего не пишет на
          # диск (картинки обрабатываются в памяти, результат уходит в S3),
          # поэтому корневая ФС монтируется только для чтения.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Воркерский /health — liveness, а не проверка зависимостей: он
          # подтверждает, что процесс жив и обслуживает вспомогательный
          # HTTP-сервер. Подключения к БД/S3/RabbitMQ проверяются на старте,
          # при инициализации (как в docker-compose.yml).
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 5
