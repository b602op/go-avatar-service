# Docker Compose для локальной инфраструктуры GophProfile.
# Запуск: docker compose -f docker/docker-compose.yml --env-file .env up -d

name: gophprofile

services:
  postgres:
    image: postgres:16-alpine
    container_name: gophprofile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avatar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avatar}
      POSTGRES_DB: ${POSTGRES_DB:-avatars}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avatar} -d ${POSTGRES_DB:-avatars}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - gophprofile

  minio:
    image: pgsty/silo:latest
    container_name: gophprofile-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - gophprofile

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gophprofile-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - gophprofile

volumes:
  pg_data:
    name: gophprofile-pg-data
  minio_data:
    name: gophprofile-minio-data
  rabbitmq_data:
    name: gophprofile-rabbitmq-data

networks:
  gophprofile:
    name: gophprofile-net
    driver: bridge