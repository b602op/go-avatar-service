# Docker Compose для GophProfile: инфраструктура + приложение.
#
# Запуск всего стека:   make up
# Только инфраструктура: make up-infra
# Или напрямую:
#   docker compose -f docker/docker-compose.yml --env-file .env up -d --build
#
# Внутри docker-сети сервисы обращаются друг к другу по именам сервисов
# (postgres, minio, rabbitmq) и ВНУТРЕННИМ портам (5432, 9000, 5672) —
# не по тем портам, что опубликованы на хост.
#
# Миграции БД применяются самими приложениями (server и worker) при старте —
# goose как библиотека поверх встроенных в бинарник migrations/*.sql. Отдельного
# сервиса для миграций нет: приложение физически не может подняться без схемы.

name: gophprofile

services:
  postgres:
    image: postgres:16-alpine
    container_name: gophprofile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avatar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avatar}
      POSTGRES_DB: ${POSTGRES_DB:-avatars}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avatar} -d ${POSTGRES_DB:-avatars}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - gophprofile

  minio:
    image: pgsty/silo:latest
    container_name: gophprofile-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - gophprofile

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gophprofile-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
      # Prometheus exporter. Плагин rabbitmq_prometheus уже включён в образе
      # (-management tag), отдельной установки не требует. Наружу публикуется
      # только для отладки: Prometheus скрейпит rabbitmq:15692 изнутри сети.
      - "15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # ВАЖНО: именно check_port_connectivity, а не ping.
      # 'ping' отвечает успехом, как только поднялся Erlang-узел, но AMQP-листенер
      # на 5672 открывается на 3-4 секунды позже. С 'ping' контейнер объявлялся
      # healthy раньше времени, и server/worker стартовали в закрытый порт:
      # "dial tcp ...:5672: connect: connection refused" → crash-loop до тех пор,
      # пока RabbitMQ не догонит. check_port_connectivity проверяет сами
      # листенеры (включая 5672), поэтому healthy означает «порт принимает
      # соединения».
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - gophprofile

  # ─── HTTP-сервер ───────────────────────────────────────────────────────────
  server:
    build:
      context: ..
      dockerfile: Dockerfile
      target: server
    container_name: gophprofile-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_PORT: 8080
      # Порт метрик сервера. Задан явно, хотя совпадает с дефолтом в коде:
      # так адрес виден в одном месте — рядом с пробросом портов ниже.
      METRICS_ADDR: :9090
      # Внутри docker-сети — имя сервиса и внутренний порт (5432, не хостовый).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-avatar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avatar}
      POSTGRES_DB: ${POSTGRES_DB:-avatars}
      POSTGRES_SSLMODE: disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-avatars}
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: avatars.exchange
      # ─── Observability ───
      # Внутри docker-сети коллектор — это jaeger:4318 (OTLP HTTP).
      # Значение из .env.example (localhost:4318) здесь не годится: для
      # контейнера localhost — он сам.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: gophprofile
      OTEL_SERVICE_VERSION: dev
      OTEL_ENVIRONMENT: local
    ports:
      - "8080:8080"
      # Порт метрик публикуется только для локальной отладки (curl/Prometheus
      # на хосте). В проде /metrics остаётся внутренним.
      - "9090:9090"
    healthcheck:
      # Тот же /health, что отдаёт приложение: 503 (degraded/down) считается
      # неуспехом, поэтому статус контейнера отражает состояние зависимостей.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - gophprofile

  # ─── Воркер обработки событий ──────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    container_name: gophprofile-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      # У воркера нет публичного HTTP-сервера, поэтому метрики и /health живут
      # на отдельном порту. Явно задаём :9091 — дефолт в коде (:9090) занят
      # сервером, и без этой переменной метрики обоих процессов конфликтовали бы.
      METRICS_ADDR: :9091
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-avatar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avatar}
      POSTGRES_DB: ${POSTGRES_DB:-avatars}
      POSTGRES_SSLMODE: disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-avatars}
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: avatars.exchange
      # Go-формат duration ("30s"), а не миллисекунды: config.Load() парсит
      # значение через time.ParseDuration, и «30000» приводит к падению старта
      # с ошибкой "must be a valid duration".
      RABBITMQ_RETRY_TTL: 30s
      # ─── Observability ───
      # Имя сервиса то же, что у server: суффикс -worker добавляет main.go,
      # поэтому в Jaeger видны два разных сервиса (gophprofile-server/-worker),
      # а общий префикс позволяет фильтровать их одной выборкой.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: gophprofile
      OTEL_SERVICE_VERSION: dev
      OTEL_ENVIRONMENT: local
    ports:
      - "9091:9091"
    healthcheck:
      # Воркерский /health — это liveness, а не проверка зависимостей: он лишь
      # подтверждает, что процесс жив и обслуживает вспомогательный HTTP-сервер.
      # Подключения к БД/S3/RabbitMQ проверяются на старте, при инициализации.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - gophprofile

  # ─── Observability ─────────────────────────────────────────────────────────
  # Стек «трейсы + метрики + логи» на одном docker-хосте: всё локальное,
  # поэтому образы с фиксированными тегами (воспроизводимость важнее свежести).
  #
  #   приложение → OTLP → jaeger          (трейсы)
  #   приложение → /metrics ← prometheus  (метрики)
  #   docker logs → promtail → loki       (логи)
  #   grafana ← prometheus + loki + jaeger (единая точка входа)

  # Jaeger all-in-one: коллектор OTLP + хранилище в памяти + UI.
  # Данные живут только в памяти процесса — для локальной отладки этого
  # достаточно, а volume для них не нужен.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: gophprofile-jaeger
    restart: unless-stopped
    environment:
      # Без этого флага Jaeger не поднимает OTLP-приёмник на 4318.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP (server/worker шлют спаны сюда)
    networks:
      - gophprofile

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gophprofile-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      # Разрешает POST /-/reload: правки конфига применяются без перезапуска.
      - "--web.enable-lifecycle"
    ports:
      # 9090 на хосте занят метриками server'а, поэтому наружу — 9092.
      - "9092:9090"
    depends_on:
      server:
        condition: service_started
      worker:
        condition: service_started
    networks:
      - gophprofile

  grafana:
    image: grafana/grafana:11.2.0
    container_name: gophprofile-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Анонимный вход только на чтение: дашборды открываются без логина,
      # но редактировать/удалять их нельзя.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - gophprofile

  loki:
    image: grafana/loki:3.2.0
    container_name: gophprofile-loki
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    networks:
      - gophprofile

  # Promtail читает логи контейнеров напрямую из docker-сокета (не с диска),
  # поэтому портов у него нет — наружу он не отдаёт ничего.
  promtail:
    image: grafana/promtail:3.2.0
    container_name: gophprofile-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - gophprofile

volumes:
  pg_data:
    name: gophprofile-pg-data
  minio_data:
    name: gophprofile-minio-data
  rabbitmq_data:
    name: gophprofile-rabbitmq-data
  prometheus_data:
    name: gophprofile-prometheus-data
  grafana_data:
    name: gophprofile-grafana-data
  loki_data:
    name: gophprofile-loki-data

networks:
  gophprofile:
    name: gophprofile-net
    driver: bridge