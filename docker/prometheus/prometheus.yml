# Конфигурация Prometheus для GophProfile.
#
# Prometheus скрейпит /metrics обоих процессов приложения по именам сервисов
# docker-compose и ВНУТРЕННИМ портам (server:9090, worker:9091) — не хостовым.
# Инфраструктурные метрики (глубина очередей) отдаёт сам RabbitMQ через
# плагин rabbitmq_prometheus на порту 15692: отдельный экспортёр не нужен.
#
# Лейбл service дублирует job_name: он делает выборки самодостаточными
# (sum by (service) (...) работает даже после объединения джобов).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gophprofile-server"
    static_configs:
      - targets: ["server:9090"]
        labels:
          service: server

  - job_name: "gophprofile-worker"
    static_configs:
      - targets: ["worker:9091"]
        labels:
          service: worker

  # Глубина очередей RabbitMQ: rabbitmq_queue_messages_ready,
  # rabbitmq_queue_messages_unacked, rabbitmq_queue_consumers.
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq
