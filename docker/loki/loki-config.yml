# Конфигурация Loki для GophProfile: один процесс, файловое хранилище.
#
# Схема v13 (tsdb) с allow_structured_metadata: true — без неё Loki отбрасывает
# структурные метаданные, и парсинг JSON-логов через | json теряет часть полей.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  allow_structured_metadata: true
  # 7 дней — столько же, сколько retention у Prometheus.
  retention_period: 168h
