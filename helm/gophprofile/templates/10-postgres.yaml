{{/*
PostgreSQL: StatefulSet с локальным PVC + headless Service.

StatefulSet, а не Deployment: у БД есть состояние, и она должна сохранять
привязку «под ↔ том» между перезапусками. Service headless (clusterIP: None) —
обязательное условие StatefulSet: он даёт стабильное DNS-имя postgres.<ns>.svc,
по которому приложение подключается к единственной реплике.

Капабилити: drop ALL + возврат минимума. Полный drop проверен и не работает —
entrypoint образа стартует от root, готовит том (chmod 00700 PGDATA, chown
postgres) и только потом сбрасывает привилегии через gosu; без CHOWN,
DAC_OVERRIDE, FOWNER, SETGID, SETUID под уходит в CrashLoopBackOff. Подробности —
в k8s/10-postgres.yaml и docs/tech-debt.md.

readOnlyRootFilesystem не включается: БД пишет не только в том, но и во
временные каталоги (/tmp, сортировка).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ include "gophprofile.namespace" . }}
  labels:
    {{- include "gophprofile.selectorLabels" (dict "component" "postgres") | nindent 4 }}
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gophprofile.selectorLabels" (dict "component" "postgres") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ include "gophprofile.namespace" . }}
  labels:
    {{- include "gophprofile.selectorLabels" (dict "component" "postgres") | nindent 4 }}
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" (dict "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gophprofile.selectorLabels" (dict "component" "postgres") | nindent 8 }}
        {{- include "gophprofile.labels" . | nindent 8 }}
    spec:
      # Инфраструктурный SA: БД не обращается к Kubernetes API, токен не нужен.
      serviceAccountName: gophprofile-db-sa
      # fsGroup: групповое владение томом. На hostPath-томах локального кластера
      # kubelet права не переписывает, поэтому здесь это фактически только
      # дополнительная группа процесса; с CSI-провижнером группа выставится и
      # на файлах — см. docs/tech-debt.md.
      securityContext:
        fsGroup: 1000
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 5432
          # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB: официальный образ
          # создаёт пользователя и базу при первой инициализации тома.
          envFrom:
            - secretRef:
                name: gophprofile-secrets
          env:
            # Данные в подкаталоге pgdata, а не в корне тома: на томе может
            # лежать lost+found, из-за которого initdb отказывается работать.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # pg_isready — штатная проверка готовности: сервер принимает
          # соединения, а не просто процесс запущен.
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "avatar", "-d", "avatars"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "avatar", "-d", "avatars"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
