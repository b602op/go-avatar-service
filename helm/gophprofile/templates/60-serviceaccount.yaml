{{/*
ServiceAccount'ы: отдельный для приложения и отдельный для инфраструктуры, оба
без автомонтирования токена — ни приложению, ни БД Kubernetes API не нужен.
RBAC (Role/RoleBinding) намеренно не добавляется: без токена под в API не
обращается, а «пустая» роль создавала бы лишь видимость прав.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gophprofile-sa
  namespace: {{ include "gophprofile.namespace" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gophprofile-db-sa
  namespace: {{ include "gophprofile.namespace" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
automountServiceAccountToken: false
