{{/*
HTTP-сервер: Service + Deployment.

Deployment, а не StatefulSet: сервер не хранит состояние — метаданные в
PostgreSQL, файлы в S3, поэтому реплики взаимозаменяемы.

initContainer ждёт готовности postgres, minio и rabbitmq — аналог
`depends_on: {condition: service_healthy}` из docker-compose.yml: приложение не
ретраит подключения и при первом старте уходило бы в CrashLoopBackOff.

securityContext: непривилегированный пользователь (uid 1000, а не uid 100 из
образа — важна непривилегированность, а не конкретное число),
readOnlyRootFilesystem (приложение ничего не пишет на диск: картинки
обрабатываются в памяти), без капабилити вообще — сервер слушает порты > 1024.
Разбор — в k8s/20-server.yaml.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: {{ include "gophprofile.namespace" . }}
  labels:
    {{- include "gophprofile.selectorLabels" (dict "component" "server") | nindent 4 }}
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "gophprofile.selectorLabels" (dict "component" "server") | nindent 4 }}
  ports:
    # 80 → 8080: снаружи удобнее обращаться по стандартному порту, в него же
    # целится Ingress.
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: 8080
    # Метрики отдельным портом: их скрейпит Prometheus (ServiceMonitor), а не
    # пользовательский трафик. Номер совпадает с server.metricsAddr.
    - name: metrics
      port: 9090
      targetPort: 9090
---
{{/*
Headless Service только для сбора метрик.

Обычный Service балансирует: скрейп попадает в случайный под, и серии разных
реплик склеиваются. Headless (clusterIP: None) отдаёт DNS-имена всех подов,
поэтому Prometheus со static config (templates/70-prometheus.yaml) скрейпит
каждую реплику отдельно — как это делает ServiceMonitor через Endpoints.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: server-metrics
  namespace: {{ include "gophprofile.namespace" . }}
  labels:
    {{- include "gophprofile.selectorLabels" (dict "component" "server") | nindent 4 }}
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "gophprofile.selectorLabels" (dict "component" "server") | nindent 4 }}
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: {{ include "gophprofile.namespace" . }}
  labels:
    {{- include "gophprofile.selectorLabels" (dict "component" "server") | nindent 4 }}
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  # При включённом HPA это лишь стартовое значение: дальше число реплик
  # определяет контроллер автомасштабирования.
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" (dict "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gophprofile.selectorLabels" (dict "component" "server") | nindent 8 }}
        {{- include "gophprofile.labels" . | nindent 8 }}
    spec:
      serviceAccountName: gophprofile-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Graceful shutdown: kubelet сначала выполняет preStop, и только потом
      # отправляет SIGTERM, а через terminationGracePeriodSeconds убивает под
      # SIGKILL. 30 секунд с запасом покрывают паузу preStop (5s) и догрузку
      # in-flight запросов (верхняя граница обработки — middleware.Timeout, 30s).
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              for target in postgres:5432 minio:9000 rabbitmq:5672; do
                host=${target%:*}
                port=${target#*:}
                until nc -w 2 "$host" "$port" </dev/null; do
                  echo "waiting for $host:$port"
                  sleep 2
                done
                echo "$host:$port is ready"
              done
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
            - containerPort: 9090
          # Graceful shutdown, шаг 1: пауза перед SIGTERM. К моменту остановки
          # процесса под уже должен быть исключён из Endpoints сервиса, иначе
          # запросы, попавшие в окно между удалением из Endpoints и SIGTERM,
          # рвутся. kube-proxy замечает изменение Endpoints асинхронно, поэтому
          # без паузы клиенты получают ошибки соединения на каждом рестарте.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          # Несекретная конфигурация + учётные данные. Значения из env ниже
          # переопределяют одноимённые ключи из Secret, чтобы явно было видно,
          # что именно нужно приложению.
          envFrom:
            - configMapRef:
                name: gophprofile-config
            - secretRef:
                name: {{ include "gophprofile.secretName" . }}
          env:
            - name: HTTP_PORT
              value: {{ .Values.server.port | quote }}
            - name: METRICS_ADDR
              value: {{ .Values.server.metricsAddr | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: POSTGRES_DB
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: S3_SECRET_KEY
            # RABBITMQ_URL собирается из логина и пароля, поэтому лежит в Secret,
            # а не в ConfigMap: иначе пароль брокера был бы виден в описании
            # ConfigMap и в истории ревизий Helm.
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: RABBITMQ_URL
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Две разные пробы с разными вопросами — не перепутать:
          #
          #  liveness (/live)  — «процесс жив?». Зависимости не проверяются,
          #      ответ безусловный. Падение S3/БД/брокера НЕ должно перезапускать
          #      под: процесс жив, а старт приложения требует доступного S3
          #      (EnsureBucket без ретраев), поэтому рестарт ведёт в
          #      CrashLoopBackOff и не лечит ничего.
          #
          #  readiness (/health) — «можно ли направлять сюда трафик?». Опрашивает
          #      БД, S3 и брокер: 200 — всё в порядке, 503 — часть зависимостей
          #      недоступна. Пока так, под исключён из Endpoints, но продолжает
          #      работать, и возвращается в балансировку сам, когда зависимости
          #      поднимутся.
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
