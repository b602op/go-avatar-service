{{- if not .Values.secrets.existingSecret }}
{{/*
Учётные данные приложения и инфраструктуры.

stringData, а не data: значения из values.yaml не нужно кодировать в base64
руками. Secret, а не ConfigMap — эти значения не должны попадать в
`kubectl describe pod` и в логи.

Этот объект создаётся только для локального стенда. В проде задаётся
`secrets.existingSecret`: чарт Secret не создаёт, а server, worker, Job миграций
и инфраструктура читают внешний объект (см. docs/tech-debt.md).

Контракт внешнего Secret — те же ключи, что ниже:
  POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
  MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, S3_ACCESS_KEY, S3_SECRET_KEY,
  RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS, RABBITMQ_URL
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophprofile.secretName" . }}
  namespace: {{ include "gophprofile.namespace" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PostgreSQL: официальный образ заводит пользователя и базу при инициализации тома.
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  # MinIO/S3: S3_ACCESS_KEY / S3_SECRET_KEY читает приложение, MINIO_ROOT_* —
  # сам образ хранилища.
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  # RabbitMQ: брокер создаёт пользователя при инициализации тома, приложение
  # ходит под ним же.
  RABBITMQ_DEFAULT_USER: {{ .Values.secrets.rabbitmqUser | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.secrets.rabbitmqPassword | quote }}
  # URL целиком — в Secret, а не в ConfigMap: в нём пароль. Значения со
  # спецсимволами (`@`, `:`, `/`) требуют percent-encoding; для учебного стенда
  # это не актуально, в проде URL приходит готовым из внешнего хранилища.
  RABBITMQ_URL: {{ printf "amqp://%s:%s@rabbitmq:5672/" .Values.secrets.rabbitmqUser .Values.secrets.rabbitmqPassword | quote }}
{{- end }}
