{{/*
Воркер обработки событий: Service + Deployment на 1 реплику.

Deployment, а не StatefulSet: состояние воркера — очередь в RabbitMQ и записи в
PostgreSQL, а не локальный диск. Service нужен только ради метрик и /health:
публичного HTTP-API у воркера нет.

securityContext — как у сервера (см. templates/20-server.yaml); воркер тоже
ничего не пишет на диск: картинки обрабатываются в памяти, результат уходит в S3.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: {{ include "gophprofile.namespace" . }}
  labels:
    {{- include "gophprofile.selectorLabels" (dict "component" "worker") | nindent 4 }}
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gophprofile.selectorLabels" (dict "component" "worker") | nindent 4 }}
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
---
{{/*
Headless Service только для сбора метрик: DNS отдаёт по A-записи на каждый под,
поэтому Prometheus со static config скрейпит все реплики (см. templates/
20-server.yaml и 70-prometheus.yaml).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  namespace: {{ include "gophprofile.namespace" . }}
  labels:
    {{- include "gophprofile.selectorLabels" (dict "component" "worker") | nindent 4 }}
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "gophprofile.selectorLabels" (dict "component" "worker") | nindent 4 }}
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ include "gophprofile.namespace" . }}
  labels:
    {{- include "gophprofile.selectorLabels" (dict "component" "worker") | nindent 4 }}
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  # Воркер масштабируется не по CPU, а по глубине очереди (отдельная задача),
  # поэтому HPA для него нет и replicas задаётся значением.
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" (dict "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gophprofile.selectorLabels" (dict "component" "worker") | nindent 8 }}
        {{- include "gophprofile.labels" . | nindent 8 }}
    spec:
      serviceAccountName: gophprofile-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              for target in postgres:5432 minio:9000 rabbitmq:5672; do
                host=${target%:*}
                port=${target#*:}
                until nc -w 2 "$host" "$port" </dev/null; do
                  echo "waiting for $host:$port"
                  sleep 2
                done
                echo "$host:$port is ready"
              done
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 9091
          envFrom:
            - configMapRef:
                name: gophprofile-config
            - secretRef:
                name: {{ include "gophprofile.secretName" . }}
          env:
            # У воркера нет публичного HTTP-сервера: метрики и /health живут на
            # отдельном порту, чтобы не конфликтовать с :9090 сервера.
            - name: METRICS_ADDR
              value: {{ .Values.worker.metricsAddr | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: POSTGRES_DB
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: S3_SECRET_KEY
            # RABBITMQ_URL собирается из логина и пароля, поэтому лежит в Secret,
            # а не в ConfigMap (см. templates/20-server.yaml).
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: RABBITMQ_URL
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Воркерский /health — liveness, а не проверка зависимостей: он
          # подтверждает, что процесс жив и обслуживает вспомогательный
          # HTTP-сервер. Подключения к БД/S3/RabbitMQ проверяются на старте.
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 5
